<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================
   GALAXY VIEWER FRAME
===================================== */

#galaxyContainer {

    position: relative;
    width: 90%;
    height: 85vh;
    margin: 40px auto;
    padding: 20px;

    background: #050505;
    border: 1px solid #333;

    box-shadow:
        0 0 40px rgba(0,0,0,.9),
        inset 0 0 50px #000;
}


/* =====================================
   MAP WINDOW
===================================== */

#map {

    width: 100%;
    height: 100%;
    background: #000;

    cursor:
        url("https://i.ibb.co/6RTJPXpn/map-cursor.png") 16 16,
        crosshair;
}


/* =====================================
   SEARCH HUD
===================================== */

#searchContainer {

    position: absolute;

    top: 35px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 999999;

    display: flex;
    align-items: flex-start;
    gap: 10px;
}


/* =====================================
   SEARCH BAR
===================================== */

#planetSearch {

    width: 320px;

    padding: 12px;

    background: #111;
    color: white;

    border: 1px solid #00c3ff;

    outline: none;

    font-family: Courier, monospace;
    font-size: 16px;

    box-shadow:
        0 0 10px rgba(0,195,255,.4);
}


#planetSearch::placeholder {
    color: #888;
}


/* =====================================
   SEARCH RESULTS
===================================== */

#results {

    display: none;

    width: 320px;

    background: #111;

    border: 1px solid #00c3ff;
}


.result {

    padding: 10px;

    color: white;

    cursor: pointer;

    font-family: Courier, monospace;
}


.result:hover {
    background: #003344;
}


/* =====================================
   MUSIC BUTTON
===================================== */

#musicToggle {

    padding: 12px 18px;

    background: #111;

    color: #888;

    border: 1px solid #444;

    cursor: pointer;

    font-size: 15px;

    transition: .25s;

    white-space: nowrap;
}


#musicToggle:hover {

    border-color: #00c3ff;

    color: white;
}


#musicToggle.playing {

    color: #00c3ff;

    border-color: #00c3ff;

    box-shadow:
        0 0 12px rgba(0,195,255,.45);
}


/* =====================================
   SFX BUTTON
===================================== */

#sfxToggle {

    padding: 12px 18px;

    background: #111;

    color: #888;

    border: 1px solid #444;

    cursor: pointer;

    font-size: 15px;

    transition: .25s;

    white-space: nowrap;
}


#sfxToggle:hover {

    border-color: #00c3ff;

    color: white;
}


#sfxToggle.disabled {

    color: #888;

    border-color: #444;

    box-shadow: none;
}


/* =====================================
   COORDINATE HUD
===================================== */

#coordinateHUD {

    position: absolute;

    bottom: 35px;
    right: 35px;

    z-index: 999999;

    padding: 10px 15px;

    background: rgba(0,0,0,.8);

    color: #00c3ff;

    border: 1px solid #00c3ff;

    font-family: monospace;

    font-size: 14px;

    box-shadow:
        0 0 10px rgba(0,195,255,.4);
}


/* =====================================
   POPUPS
===================================== */

.leaflet-popup-content-wrapper {

    background: #111;

    color: white;

    border: 1px solid #00c3ff;
}


.leaflet-popup-tip {
    background: #111;
}


.leaflet-popup-content {

    max-height: 350px;

    overflow-y: auto;

    scrollbar-width: thin;

    scrollbar-color:
        #00c3ff
        #050505;
}


/* =====================================
   POPUP SCROLLBAR
===================================== */

.leaflet-popup-content::-webkit-scrollbar {
    width: 4px;
}


.leaflet-popup-content::-webkit-scrollbar-track {

    background: #050505;

    border-radius: 6px;
}


.leaflet-popup-content::-webkit-scrollbar-thumb {

    background: #00c3ff;

    border-radius: 6px;

    border: 1px solid #111;
}


.leaflet-popup-content::-webkit-scrollbar-thumb:hover {
    background: #66ddff;
}


/* =====================================
   SYSTEM MARKERS
===================================== */

.poi {

    border-radius: 50%;

    background: #00c3ff;

    border: 1px solid white;
}


/* High priority */

.poi-high {

    width: 14px;
    height: 14px;
}


/* Medium priority */

.poi-medium {

    width: 10px;
    height: 10px;
}


/* Low priority */

.poi-low {

    width: 7px;
    height: 7px;
}


/* Marker hover cursor */

.poi:hover {

    cursor:
        url("https://i.ibb.co/MkQbwLmH/map-cursor2.png") 16 16,
        pointer;
}


/* =====================================
   PLANET NAME LABELS
===================================== */

.planetLabel {

    background: rgba(0,0,0,.75);

    color: #00c3ff;

    border: 1px solid #00c3ff;

    padding: 4px 8px;

    font-family: monospace;

    font-size: 13px;

    font-weight: bold;

    white-space: nowrap;

    box-shadow:
        0 0 8px rgba(0,195,255,.5);
}


.leaflet-tooltip.planetLabel {

    background: rgba(0,0,0,.75);
}


.leaflet-tooltip.planetLabel::before {
    display: none;
}


/* =====================================
   GALACTIC GRID
===================================== */

.galaxyGridCell {

    background: transparent;

    border: 1px solid rgba(0,195,255,.22);

    box-sizing: border-box;

    pointer-events: none;
}


.gridCoordinateLabel {

    background: transparent;

    border: none;

    color: rgba(0,195,255,.55);

    font-family: monospace;

    font-size: 13px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 5px #000,
        0 0 8px #000;

    pointer-events: none;

    white-space: nowrap;
}


.leaflet-marker-icon.gridCoordinateLabel {

    margin: 0 !important;
}

</style>

<div id="galaxyContainer">


<div id="searchContainer">

    <button id="musicToggle">
        ♪ Music OFF
    </button>
    
    <button id="sfxToggle" class="enabled">
    	🔊 SFX ON
	</button>

    <input
        id="planetSearch"
        type="text"
        placeholder="Search galaxy...">

    <div id="results"></div>

</div>

    X: 0 | Y: 0 | GRID: --
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="database.js"></script>

<script>


// =====================================
// GALAXY IMAGE SETTINGS
// =====================================


const imageWidth = 6000;

const imageHeight = 3375;



const bounds = [

    [0,0],

    [imageHeight,imageWidth]

];




// =====================================
// CREATE MAP
// =====================================


const map = L.map("map", {

    crs:L.CRS.Simple,

    minZoom:-2,

    maxZoom:3,

    zoomSnap:0.25,

    maxBounds:bounds,

    maxBoundsViscosity:1

});





// =====================================
// LOAD MAP IMAGE
// =====================================


L.imageOverlay(

"genesis-map-v0-0-1.png",

bounds

).addTo(map);



map.fitBounds(bounds);



// =====================================
// COORDINATE TRACKER
// =====================================

const coordinateHUD =
document.getElementById("coordinateHUD");


map.on("mousemove", function(e){


    let x = Math.round(e.latlng.lng);

    let y = Math.round(e.latlng.lat);


    coordinateHUD.innerHTML =
    `X: ${x} | Y: ${y}`;


});





// =====================================
// =====================================
// GALACTIC GRID
// =====================================
// Grid rectangle: X 1560-4435, Y 3120-250.
// This produces columns A-W and rows 1-23.

const GRID_SIZE = 125;

const GRID_START_X = 1565;
const GRID_START_Y = 3120;

const GRID_END_X = 4435;
const GRID_END_Y = 250;

const GRID_MIN_ZOOM_FOR_LABELS = 0;

const gridLayer = L.layerGroup().addTo(map);
const gridLabelsLayer = L.layerGroup().addTo(map);

const gridColumns = Math.ceil(
    (GRID_END_X - GRID_START_X) / GRID_SIZE
);

const gridRows = Math.ceil(
    (GRID_END_Y - GRID_START_Y) / GRID_SIZE
);

function columnLetter(index) {
    let result = "";
    let n = index + 1;

    while (n > 0) {
        const remainder = (n - 1) % 26;
        result = String.fromCharCode(65 + remainder) + result;
        n = Math.floor((n - 1) / 26);
    }

    return result;
}

function getGridCoordinate(x, y) {
    if (
        x < GRID_START_X ||
        x >= GRID_END_X ||
        y < GRID_END_Y ||
        y >= GRID_START_Y
    ) {
        return "--";
    }

    const column = Math.floor(
        (x - GRID_START_X) / GRID_SIZE
    );

    const row = Math.floor(
        (GRID_START_Y - y) / GRID_SIZE
    );

    if (
        column < 0 ||
        column >= gridColumns ||
        row < 0 ||
        row >= gridRows
    ) {
        return "--";
    }

    return `${columnLetter(column)}${row + 1}`;
}

function buildGalaxyGrid() {
    for (let row = 0; row < gridRows; row++) {
        const y1 = GRID_START_Y - ((row + 1) * GRID_SIZE);
        const y2 = GRID_START_Y - (row * GRID_SIZE);

        for (let column = 0; column < gridColumns; column++) {
            const x1 = GRID_START_X + (column * GRID_SIZE);
            const x2 = Math.min(
                GRID_START_X + ((column + 1) * GRID_SIZE),
                GRID_END_X
            );

            const coordinate = `${columnLetter(column)}${row + 1}`;

            L.rectangle(
                [[y1, x1], [y2, x2]],
                {
                    className: "galaxyGridCell",
                    stroke: true,
                    color: "#00c3ff",
                    weight: 1,
                    opacity: 0.22,
                    fill: false,
                    interactive: false
                }
            ).addTo(gridLayer);

            const centerY = (y1 + y2) / 2;
            const centerX = (x1 + x2) / 2;

            L.marker(
                [centerY, centerX],
                {
                    icon: L.divIcon({
                        className: "gridCoordinateLabel",
                        html: coordinate,
                        iconSize: [60, 20],
                        iconAnchor: [30, 10]
                    }),
                    interactive: false,
                    keyboard: false
                }
            ).addTo(gridLabelsLayer);
        }
    }
}

function updateGalaxyGrid() {
    const zoom = map.getZoom();
    let gridOpacity = 0.12;

    if (zoom >= -1) gridOpacity = 0.18;
    if (zoom >= 0) gridOpacity = 0.25;
    if (zoom >= 1) gridOpacity = 0.32;
    if (zoom >= 2) gridOpacity = 0.40;

    gridLayer.eachLayer(layer => {
        layer.setStyle({ opacity: gridOpacity });
    });

    if (zoom >= GRID_MIN_ZOOM_FOR_LABELS) {
        if (!map.hasLayer(gridLabelsLayer)) {
            gridLabelsLayer.addTo(map);
        }
    } else if (map.hasLayer(gridLabelsLayer)) {
        map.removeLayer(gridLabelsLayer);
    }
}

buildGalaxyGrid();
updateGalaxyGrid();
map.on("zoomend", updateGalaxyGrid);

map.on("mousemove", function(e) {
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
    const gridCoordinate = getGridCoordinate(x, y);

    coordinateHUD.innerHTML =
        `X: ${x} | Y: ${y} | GRID: ${gridCoordinate}`;
});


// CUSTOM MARKER
// ====================================


const poiIcon = L.divIcon({

    className:"",

    html:'<div class="poi"></div>',

    iconSize:[18,18],

    iconAnchor:[9,9]

});

// =====================================
// BUILD WORLD LIST
// =====================================

function buildWorldList(system){


    // Grouped systems (Hapes, etc.)

    if(system.worldGroups){


return `

<div style="
    margin-top:8px;
    margin-bottom:4px;
">
    <strong>Worlds:</strong>
</div>


${system.worldGroups.map(group => `

<div style="
    margin-top:8px;
    font-weight:bold;
">

${group.label}

</div>


<ul style="
    margin:2px 0 6px 18px;
    padding:0;
">

${group.worlds.map(world => `

<li>

<a href="${world.link}" target="_blank">

${world.name}

</a>


${world.moons ? `

<ul style="
    margin:2px 0 2px 18px;
    padding:0;
">


${world.moons.map(moon => `

<li>

<a href="${moon.link}" target="_blank">

${moon.name}

</a>

</li>


`).join("")}


</ul>

` : ""}


</li>


`).join("")}

</ul>


`).join("")}


${system.link ? `

<a href="${system.link}" target="_blank">
View Wookieepedia
</a>

` : ""}

`;

    }



    // Normal systems

    if(system.worlds){


        return `

        <div style="
            margin-top:8px;
            margin-bottom:4px;
        ">
            <strong>Worlds:</strong>
        </div>


        <ul style="
            margin:2px 0 6px 18px;
            padding:0;
        ">


        ${system.worlds.map(world => `

            <li>

                <a href="${world.link}" target="_blank">

                    ${world.name}

                </a>

            </li>


        `).join("")}


        </ul>

        `;

    }



    // Normal planets

    return `

    <a href="${system.link}" target="_blank">

        View Wookieepedia

    </a>

    `;


}

// =====================================
// CREATE SYSTEM MARKERS
// =====================================


systems.forEach(system => {


system.marker = L.marker(

    [system.y,system.x],

    {icon:poiIcon}

)

.addTo(map)

.on("click",function(){

    if(sfxEnabled){

        planetClickSFX.pause();

        planetClickSFX.currentTime = 0;

        planetClickSFX.play();

    }

})

.bindPopup(`

<h3 style="margin-bottom:2px;">
    ${system.name}
</h3>

${system.aka ? `
<div style="
    font-size:12px;
    color:#aaa;
    margin-bottom:10px;
    font-style:italic;
">
    aka ${system.aka}
</div>
` : ""}

<p><strong>Affiliation:</strong> ${system.affiliation || "Neutral"}</p>

${system.description ? `<p>${system.description}</p>` : ""}

${buildWorldList(system)}

`)



.bindTooltip(

    system.name,

    {

    permanent:true,

    direction:"right",

    offset:[10,0],

    className:"planetLabel",

    opacity:0

    }

);



});

// SHOW PLANET NAMES ON ZOOM

function updatePlanetLabels(){


let zoom = map.getZoom();



systems.forEach(system => {


    if(system.marker._tooltip){


        if(zoom >= -1){

            system.marker._tooltip.options.opacity = 1;

            system.marker.openTooltip();


        } else {


            system.marker._tooltip.options.opacity = 0;

            system.marker.closeTooltip();


        }


    }


});


}



map.on("zoomend", updatePlanetLabels);


// Run once when map loads

updatePlanetLabels();

// =====================================
// GET SEARCHABLE WORLD NAMES
// =====================================

function getWorldNames(system){

    let names = [];


    // Grouped systems (Hapes, Japrael, etc.)

    if(system.worldGroups){

        system.worldGroups.forEach(group => {

            group.worlds.forEach(world => {

                names.push(world.name);


                // Include moons

                if(world.moons){

                    world.moons.forEach(moon => {

                        names.push(moon.name);

                    });

                }

            });

        });

    }


    // Normal systems

    if(system.worlds){

        system.worlds.forEach(world => {

            names.push(world.name);

        });

    }


    return names;

}

// =====================================
// SEARCH SYSTEM
// =====================================


const searchBox =
document.getElementById("planetSearch");


const results =
document.getElementById("results");





searchBox.addEventListener("input",function(){


let query =
this.value.toLowerCase();



results.innerHTML="";



if(query.length === 0){

    results.style.display="none";

    return;

}





let matches = systems.filter(system =>

    system.name.toLowerCase().includes(query)

    ||

    (system.aka &&
     system.aka.toLowerCase().includes(query))

    ||

    getWorldNames(system).some(name =>

        name.toLowerCase().includes(query)

    )

);





if(matches.length === 0){

    results.style.display="none";

    return;

}





matches.forEach(system=>{


let option =
document.createElement("div");


option.className="result";


option.textContent =
system.aka
    ? `${system.name} (${system.aka})`
    : system.name;



option.onclick=function(){



map.flyTo(

    [system.y,system.x],

    1,

    {

    duration:1.5

    }

);



system.marker.openPopup();



searchBox.value =
system.name;


results.style.display="none";


};



results.appendChild(option);



});



results.style.display="block";



});






// Hide results when clicking map

map.on("click",()=>{

results.style.display="none";

});
    
// =====================================
// PLANET CLICK SOUND
// =====================================

const planetClickSFX = new Audio(
    "https://files.catbox.moe/a5nm4r.wav"
);

planetClickSFX.preload = "auto";

let sfxEnabled = true;
    
// =====================================
// SFX TOGGLE
// =====================================

const sfxButton =
document.getElementById("sfxToggle");


sfxButton.addEventListener("click",function(){

    sfxEnabled = !sfxEnabled;

    if(sfxEnabled){

        sfxButton.textContent =
        "🔊 SFX ON";

        sfxButton.classList.remove("disabled");

    }

    else{

        sfxButton.textContent =
        "🔇 SFX OFF";

        sfxButton.classList.add("disabled");

    }

});

</script>
