===================================== */

.planetLabel {

/* =====================================
   GALACTIC GRID
===================================== */

.galaxyGridCell {

    background: transparent;

    border: 1px solid rgba(0,195,255,.22);

    box-sizing: border-box;

    pointer-events: none;
}


.gridCoordinateLabel {

    background: transparent;

    border: none;

    color: rgba(0,195,255,.55);

    font-family: monospace;

    font-size: 13px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        0 0 5px #000,

    pointer-events: none;

    margin: 0 !important;

</style>


<div id="galaxyContainer">


    <!-- =====================================
         SEARCH / CONTROLS
    ====================================== -->

    <div id="searchContainer">

        <button id="musicToggle">
            ♪ Music OFF
        </button>

        <button id="sfxToggle">
            🔊 SFX ON
        </button>

        <input
            id="planetSearch"
            type="text"
            placeholder="Search galaxy..."
        >

        <div id="results"></div>

    </div>


    <!-- =====================================
         MAP
    ====================================== -->

    <div id="map"></div>


    <!-- =====================================
         COORDINATE HUD
    ====================================== -->

    <div id="coordinateHUD">
        X: 0 | Y: 0 | GRID: --
    </div>


</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="database.js"></script>


<script>

/* =====================================
   GALAXY IMAGE SETTINGS
===================================== */

const imageWidth = 6000;
const imageHeight = 3375;


const bounds = [

    [0, 0],

    [imageHeight, imageWidth]

];


/* =====================================
   CREATE MAP
===================================== */

const map = L.map("map", {

    crs: L.CRS.Simple,

    minZoom: -2,

    maxZoom: 3,

    zoomSnap: 0.25,

    maxBounds: bounds,

    maxBoundsViscosity: 1

});


/* =====================================
   LOAD MAP IMAGE
===================================== */

L.imageOverlay(

    "genesis-map-v0-0-1.png",

    bounds

).addTo(map);


map.fitBounds(bounds);


/* =====================================
   COORDINATE HUD
===================================== */

const coordinateHUD =
    document.getElementById("coordinateHUD");


/* =====================================
   GALACTIC GRID
===================================== */

/*
    GRID CORNERS
    --------------------------------
    Top-left corner of A1:
        X = 1565
        Y = 3120

    Bottom-right corner of W23:
        X = 4435
        Y = 250

    The grid automatically divides
    this rectangle into:

        23 columns
        23 rows

    Therefore:

        A1 → W23
*/

const GRID_START_X = 1565;
const GRID_START_Y = 3120;

const GRID_END_X = 4435;
const GRID_END_Y = 250;


/* =====================================
   GRID DIMENSIONS
===================================== */

const GRID_COLUMNS = 23;
const GRID_ROWS = 23;

const GRID_MIN_ZOOM_FOR_LABELS = 0;


/* =====================================
   CALCULATE CELL SIZE
===================================== */

const GRID_WIDTH =
    GRID_END_X - GRID_START_X;

const GRID_HEIGHT =
    GRID_START_Y - GRID_END_Y;

const GRID_SIZE_X =
    GRID_WIDTH / GRID_COLUMNS;

const GRID_SIZE_Y =
    GRID_HEIGHT / GRID_ROWS;


/* =====================================
   GRID LAYERS
===================================== */

const gridLayer =
    L.layerGroup().addTo(map);

const gridLabelsLayer =
    L.layerGroup().addTo(map);


/* =====================================
   GRID COLUMN LETTERS
===================================== */

function columnLetter(index) {

    let result = "";

    let n = index + 1;

    while(n > 0) {

        const remainder =
            (n - 1) % 26;

        result =
            String.fromCharCode(
                65 + remainder
            ) + result;

        n =
            Math.floor(
                (n - 1) / 26
            );

    }

    return result;
}


/* =====================================
   GET GRID COORDINATE
===================================== */

function getGridCoordinate(x, y) {

    /* =================================
       CHECK WHETHER POINT IS INSIDE GRID
    ================================= */

    if(
        x < GRID_START_X ||
        x > GRID_END_X ||
        y > GRID_START_Y ||
        y < GRID_END_Y
    ) {

        return "--";

    }


    /* =================================
       CALCULATE COLUMN
    ================================= */

    const column =
        Math.floor(
            (x - GRID_START_X) / GRID_SIZE_X
        );


    /* =================================
       CALCULATE ROW
    ================================= */

    const row =
        Math.floor(
            (GRID_START_Y - y) / GRID_SIZE_Y
        );


    /* =================================
       SAFETY CHECK
    ================================= */

    if(
        column < 0 ||
        column >= GRID_COLUMNS ||
        row < 0 ||
        row >= GRID_ROWS
    ) {

        return "--";

    }


    return `${columnLetter(column)}${row + 1}`;

}


/* =====================================
   BUILD GALACTIC GRID
===================================== */

function buildGalaxyGrid() {

    gridLayer.clearLayers();
    gridLabelsLayer.clearLayers();

    /* =================================
       DRAW VERTICAL GRID LINES
    ================================= */

    for (let column = 0; column <= GRID_COLUMNS; column++) {

        const x =
            GRID_START_X +
            (column * GRID_SIZE_X);

        L.polyline(
            [
                [GRID_END_Y, x],
                [GRID_START_Y, x]
            ],
            {
                color: "#00c3ff",
                weight: 1,
                opacity: 0.22,
                interactive: false
            }
        ).addTo(gridLayer);
    }


    /* =================================
       DRAW HORIZONTAL GRID LINES
    ================================= */

    for (let row = 0; row <= GRID_ROWS; row++) {

        const y =
            GRID_START_Y -
            (row * GRID_SIZE_Y);

        L.polyline(
            [
                [y, GRID_START_X],
                [y, GRID_END_X]
            ],
            {
                color: "#00c3ff",
                weight: 1,
                opacity: 0.22,
                interactive: false
            }
        ).addTo(gridLayer);
    }


    /* =================================
       DRAW GRID LABELS
    ================================= */

    for (let row = 0; row < GRID_ROWS; row++) {

        const centerY =
            GRID_START_Y -
            ((row + 0.5) * GRID_SIZE_Y);

        for (let column = 0; column < GRID_COLUMNS; column++) {

            const centerX =
                GRID_START_X +
                ((column + 0.5) * GRID_SIZE_X);

            const coordinate =
                `${columnLetter(column)}${row + 1}`;

            L.marker(
                [centerY, centerX],
                {
                    icon: L.divIcon({

                        className:
                            "gridCoordinateLabel",

                        html:
                            `<div style="
                               width: 60px;
                               height: 20px;
                               display: flex;
                               align-items: center;
                               justify-content: center;
                           ">${coordinate}</div>`,

                        iconSize:
                            [60, 20],

                        iconAnchor:
                            [30, 10]

                    }),

                    interactive: false,
                    keyboard: false
                }
            ).addTo(gridLabelsLayer);
        }
    }
}


/* =====================================
   UPDATE GALACTIC GRID
===================================== */

function updateGalaxyGrid() {

    const zoom =
        map.getZoom();


    let gridOpacity = 0.12;


    if(zoom >= -1) {

        gridOpacity = 0.18;

    }


    if(zoom >= 0) {

        gridOpacity = 0.25;

    }


    if(zoom >= 1) {

        gridOpacity = 0.32;

    }


    if(zoom >= 2) {

        gridOpacity = 0.40;

    }


    gridLayer.eachLayer(layer => {

        layer.setStyle({

            opacity:
                gridOpacity

        });

    });


    if(
        zoom >= GRID_MIN_ZOOM_FOR_LABELS
    ) {

        if(
            !map.hasLayer(
                gridLabelsLayer
            )
        ) {

            gridLabelsLayer.addTo(map);

        }

    }

    else {

        if(
            map.hasLayer(
                gridLabelsLayer
            )
        ) {

            map.removeLayer(
                gridLabelsLayer
            );

        }

    }

}


/* =====================================
   INITIALIZE GRID
===================================== */

buildGalaxyGrid();

updateGalaxyGrid();


map.on(
    "zoomend",
    updateGalaxyGrid
);


/* =====================================
   COORDINATE TRACKER
===================================== */

map.on(
    "mousemove",
    function(e) {

        const x =
            Math.round(
                e.latlng.lng
            );


        const y =
            Math.round(
                e.latlng.lat
            );


        const gridCoordinate =
            getGridCoordinate(
                x,
                y
            );


        coordinateHUD.innerHTML =
            `X: ${x} | Y: ${y} | GRID: ${gridCoordinate}`;

    }
);


/* =====================================
   PRIORITY SETTINGS
===================================== */

const PRIORITY_SETTINGS = {

    high: {

        className:
            "poi-high",

        iconSize:
            [22, 22],

        iconAnchor:
            [11, 11],

        labelMinZoom:
            -Infinity

    },


    medium: {

        className:
            "poi-medium",

        iconSize:
            [18, 18],

        iconAnchor:
            [9, 9],

        labelMinZoom:
            0

    },


    low: {

        className:
            "poi-low",

        iconSize:
            [15, 15],

        iconAnchor:
            [7.5, 7.5],

        labelMinZoom:
            1

    }

};


/* =====================================
   GET SYSTEM PRIORITY
===================================== */

function getSystemPriority(system) {

    const priority =
        system.priority;


    if(

        priority === "high" ||

        priority === "medium" ||

        priority === "low"

    ) {

        return priority;

    }


    return "low";

}


/* =====================================
   CREATE PRIORITY MARKER
===================================== */

function createPoiIcon(priority) {

    const settings =
        PRIORITY_SETTINGS[priority];


    return L.divIcon({

        className: "",

        html: `
            <div class="poi ${settings.className}"></div>
        `,

        iconSize:
            settings.iconSize,

        iconAnchor:
            settings.iconAnchor

    });

}


/* =====================================
   BUILD WORLD LIST
===================================== */

function buildWorldList(system) {


    /* =================================
       GROUPED SYSTEMS
    ================================= */

    if(system.worldGroups) {

        return `

            <div style="
                margin-top:8px;
                margin-bottom:4px;
            ">

                <strong>
                    Worlds:
                </strong>

            </div>


            ${system.worldGroups.map(group => `

                <div style="
                    margin-top:8px;
                    font-weight:bold;
                ">

                    ${group.label}

                </div>


                <ul style="
                    margin:2px 0 6px 18px;
                    padding:0;
                ">


                    ${group.worlds.map(world => `

                        <li>

                            <a
                                href="${world.link}"
                                target="_blank"
                            >

                                ${world.name}

                            </a>


                            ${world.moons ? `

                                <ul style="
                                    margin:2px 0 2px 18px;
                                    padding:0;
                                ">


                                    ${world.moons.map(moon => `

                                        <li>

                                            <a
                                                href="${moon.link}"
                                                target="_blank"
                                            >

                                                ${moon.name}

                                            </a>

                                        </li>

                                    `).join("")}


                                </ul>

                            ` : ""}

                        </li>

                    `).join("")}


                </ul>

            `).join("")}


            ${system.link ? `

                <a
                    href="${system.link}"
                    target="_blank"
                >

                    View Wookieepedia

                </a>

            ` : ""}

        `;

    }


    /* =================================
       NORMAL SYSTEMS
    ================================= */

    if(system.worlds) {

        return `

            <div style="
                margin-top:8px;
                margin-bottom:4px;
            ">

                <strong>
                    Worlds:
                </strong>

            </div>


            <ul style="
                margin:2px 0 6px 18px;
                padding:0;
            ">


                ${system.worlds.map(world => `

                    <li>

                        <a
                            href="${world.link}"
                            target="_blank"
                        >

                            ${world.name}

                        </a>

                    </li>

                `).join("")}


            </ul>

        `;

    }


    /* =================================
       NO WORLD LIST
    ================================= */

    return `

        <a
            href="${system.link}"
            target="_blank"
        >

            View Wookieepedia

        </a>

    `;

}


/* =====================================
   PLANET CLICK SFX
===================================== */

const planetClickSFX =
    new Audio(
        "https://files.catbox.moe/a5nm4r.wav"
    );


planetClickSFX.preload =
    "auto";


let sfxEnabled = true;


/* =====================================
   CREATE SYSTEM MARKERS
===================================== */

systems.forEach(system => {


    const priority =
        getSystemPriority(system);


    system.priority =
        priority;


    system.marker =
        L.marker(

            [system.y, system.x],

            {

                icon:
                    createPoiIcon(priority)

            }

        )


        .addTo(map)


        /* =============================
           CLICK SOUND
        ============================= */

        .on(
            "click",
            function() {

                if(sfxEnabled) {

                    planetClickSFX.pause();

                    planetClickSFX.currentTime =
                        0;

                    planetClickSFX.play();

                }

            }
        )


        /* =============================
           POPUP
        ============================= */

        .bindPopup(`

            <h3 style="
                margin-bottom:2px;
            ">

                ${system.name}

            </h3>


            ${system.aka ? `

                <div style="
                    font-size:12px;
                    color:#aaa;
                    margin-bottom:10px;
                    font-style:italic;
                ">

                    aka ${system.aka}

                </div>

            ` : ""}


            <p>

                <strong>
                    Affiliation:
                </strong>

                ${system.affiliation || "Neutral"}

            </p>


            ${
                system.description
                    ? `<p>${system.description}</p>`
                    : ""
            }


            ${buildWorldList(system)}

        `)


        /* =============================
           PLANET NAME
        ============================= */

        .bindTooltip(

            system.name,

            {

                permanent: true,

                direction: "right",

                offset: [10, 0],

                className:
                    "planetLabel",

                opacity: 1

            }

        );

});


/* =====================================
   PLANET LABEL CONTROL
===================================== */

function updatePlanetLabels() {

    const zoom =
        map.getZoom();


    systems.forEach(system => {


        if(!system.marker) {
            return;
        }


        const priority =
            getSystemPriority(system);


        const settings =
            PRIORITY_SETTINGS[priority];


        /* =============================
           HIGH PRIORITY
        ============================= */

        if(priority === "high") {

            system.marker.openTooltip();

            return;

        }


        /* =============================
           MEDIUM / LOW
        ============================= */

        if(
            zoom >=
            settings.labelMinZoom
        ) {

            system.marker.openTooltip();

        }

        else {

            system.marker.closeTooltip();

        }

    });

}


map.on(
    "zoomend",
    updatePlanetLabels
);


updatePlanetLabels();


/* =====================================
   SEARCHABLE WORLD NAMES
===================================== */

function getWorldNames(system) {

    let names = [];


    /* =================================
       GROUPED SYSTEMS
    ================================= */

    if(system.worldGroups) {

        system.worldGroups.forEach(group => {

            group.worlds.forEach(world => {

                names.push(
                    world.name
                );


                if(world.moons) {

                    world.moons.forEach(moon => {

                        names.push(
                            moon.name
                        );

                    });

                }

            });

        });

    }


    /* =================================
       NORMAL SYSTEMS
    ================================= */

    if(system.worlds) {

        system.worlds.forEach(world => {

            names.push(
                world.name
            );

        });

    }


    return names;

}


/* =====================================
   SEARCH SYSTEM
===================================== */

const searchBox =
    document.getElementById(
        "planetSearch"
    );


const results =
    document.getElementById(
        "results"
    );


searchBox.addEventListener(
    "input",
    function() {


        const query =
            this.value.toLowerCase();


        results.innerHTML =
            "";


        if(query.length === 0) {

            results.style.display =
                "none";

            return;

        }


        const matches =
            systems.filter(system =>

                system.name
                    .toLowerCase()
                    .includes(query)

                ||

                (
                    system.aka &&

                    system.aka
                        .toLowerCase()
                        .includes(query)
                )

                ||

                getWorldNames(system)
                    .some(name =>

                        name
                            .toLowerCase()
                            .includes(query)

                    )

            );


        if(matches.length === 0) {

            results.style.display =
                "none";

            return;

        }


        matches.forEach(system => {


            const option =
                document.createElement(
                    "div"
                );


            option.className =
                "result";


            option.textContent =
                system.aka

                    ? `${system.name} (${system.aka})`

                    : system.name;


            option.onclick =
                function() {


                    map.flyTo(

                        [system.y, system.x],

                        1,

                        {

                            duration: 1.5

                        }

                    );


                    system.marker.openPopup();

                    system.marker.openTooltip();


                    searchBox.value =
                        system.name;


                    results.style.display =
                        "none";

                };


            results.appendChild(
                option
            );

        });


        results.style.display =
            "block";

    }
);


/* =====================================
   HIDE SEARCH RESULTS
===================================== */

map.on(
    "click",
    function() {

        results.style.display =
            "none";

    }
);


/* =====================================
   MAP MUSIC
===================================== */

const mapMusic =
    new Audio(
        "https://files.catbox.moe/o0epj8.wav"
    );


mapMusic.preload =
    "auto";


mapMusic.loop =
    true;


let musicPlaying =
    false;


const musicButton =
    document.getElementById(
        "musicToggle"
    );


musicButton.addEventListener(
    "click",
    function() {


        if(musicPlaying) {

            mapMusic.pause();

            musicPlaying =
                false;


            musicButton.classList.remove(
                "playing"
            );


            musicButton.textContent =
                "♪ Music OFF";

        }

        else {

            mapMusic.play()
                .then(() => {

                    musicPlaying =
                        true;


                    musicButton.classList.add(
                        "playing"
                    );


                    musicButton.textContent =
                        "♪ Music ON";

                })
                .catch(error => {

                    console.error(
                        "Music playback failed:",
                        error
                    );

                });

        }

    }
);


/* =====================================
   SFX TOGGLE
===================================== */

const sfxButton =
    document.getElementById(
        "sfxToggle"
    );


sfxButton.addEventListener(
    "click",
    function() {


        sfxEnabled =
            !sfxEnabled;


        if(sfxEnabled) {

            sfxButton.textContent =
                "🔊 SFX ON";


            sfxButton.classList.remove(
                "disabled"
            );

        }

        else {

            sfxButton.textContent =
                "🔇 SFX OFF";


            sfxButton.classList.add(
                "disabled"
            );

        }

    }
);

</script>
